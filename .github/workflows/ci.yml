name: Validate Lucra
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lucra-dashboard:ci .
      - run: docker run -d --name lucra-ci -p 127.0.0.1:8080:8000 lucra-dashboard:ci
      - run: curl --retry 12 --retry-all-errors --retry-delay 5 --max-time 5 --fail http://127.0.0.1:8080/api/health
      - run: curl --fail http://127.0.0.1:8080/
      - if: failure()
        run: docker logs lucra-ci
