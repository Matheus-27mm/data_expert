name: Scheduled operations
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scheduled-operations
  cancel-in-progress: false
jobs:
  reports:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report configuration state
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$SMTP_HOST" ]; then
            echo '::notice::Report delivery is inactive: configure Neon PostgreSQL and SMTP secrets.'
          fi
      - if: env.DATABASE_URL != '' && env.SMTP_HOST != ''
        run: pip install -r requirements.txt
      - if: env.DATABASE_URL != '' && env.SMTP_HOST != ''
        run: python -m scripts.report_worker
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
      PG_USE_DOCKER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backup configuration state
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_KEY" ]; then
            echo '::notice::Backup is inactive: configure DATABASE_URL and BACKUP_KEY.'
          fi
      - if: env.DATABASE_URL != '' && env.BACKUP_KEY != ''
        run: pip install 'cryptography>=44,<51' 'python-dotenv>=1,<2'
      - if: env.DATABASE_URL != '' && env.BACKUP_KEY != ''
        run: python -m scripts.backup
      - if: env.DATABASE_URL != '' && env.BACKUP_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-postgres-backup
          path: output/backups/*.enc
          retention-days: 14
          if-no-files-found: error
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed application readiness
        run: curl --retry 3 --retry-all-errors --max-time 30 --fail https://dataexpert-eight.vercel.app/api/ready
