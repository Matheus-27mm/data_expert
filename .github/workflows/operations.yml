name: Scheduled operations
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scheduled-operations
  cancel-in-progress: false
jobs:
  reports:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report configuration state
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$SMTP_HOST" ]; then
            echo '::notice::Report delivery is inactive: configure Neon PostgreSQL and SMTP secrets.'
          fi
      - if: env.DATABASE_URL != '' && env.SMTP_HOST != ''
        run: pip install -r requirements.txt
      - if: env.DATABASE_URL != '' && env.SMTP_HOST != ''
        run: python -m scripts.report_worker
  backup:
    runs-on: ubuntu-latest
    services:
      restore:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: restore-drill-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
      PG_USE_DOCKER: '1'
      PG_DOCKER_NETWORK: host
      RESTORE_DATABASE_URL: postgresql://postgres:restore-drill-only@127.0.0.1:5432/postgres
      # Optional S3-compatible destination (e.g. Cloudflare R2). While unset,
      # encrypted files fall back to workflow artifacts of this public repository.
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backup configuration state
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_KEY" ]; then
            echo '::notice::Backup is inactive: configure DATABASE_URL and BACKUP_KEY.'
          fi
          if [ -z "$BACKUP_S3_BUCKET" ]; then
            echo '::warning::Encrypted backups are stored as artifacts of a public repository. Configure BACKUP_S3_* secrets to use private storage.'
          fi
      - if: env.DATABASE_URL != '' && env.BACKUP_KEY != ''
        run: pip install -r requirements.txt
      - name: Back up and prove the dump restores
        if: env.DATABASE_URL != '' && env.BACKUP_KEY != ''
        run: python -m scripts.restore_drill
      - if: env.DATABASE_URL != '' && env.BACKUP_KEY != ''
        run: python -m scripts.company_backup
      - name: Upload to private storage
        if: env.DATABASE_URL != '' && env.BACKUP_KEY != '' && env.BACKUP_S3_BUCKET != ''
        run: aws s3 cp output/backups "s3://$BACKUP_S3_BUCKET/$(date -u +%Y/%m/%d)/" --recursive --exclude '*' --include '*.enc' ${BACKUP_S3_ENDPOINT:+--endpoint-url "$BACKUP_S3_ENDPOINT"}
      - if: env.DATABASE_URL != '' && env.BACKUP_KEY != '' && env.BACKUP_S3_BUCKET == ''
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-postgres-backup
          path: output/backups/**/*.enc
          retention-days: 14
          if-no-files-found: error
  health:
    if: vars.PUBLIC_APP_URL != ''
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.PUBLIC_APP_URL }}
    steps:
      - name: Check deployed application readiness
        run: curl --retry 3 --retry-all-errors --max-time 30 --fail "$APP_URL/api/ready"
